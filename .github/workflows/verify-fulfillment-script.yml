name: Verify Starter Fulfillment Script
on:
  push:
    branches: [main]
    paths:
      - 'ops/starter-fulfillment.gs'
      - 'ops/test-starter-fulfillment.js'
      - '.github/workflows/verify-fulfillment-script.yml'
  workflow_dispatch:
jobs:
  static-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and safety checks
        shell: bash
        run: |
          set -euo pipefail
          cp ops/starter-fulfillment.gs /tmp/guestops-fulfillment.js
          node --check /tmp/guestops-fulfillment.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ops/starter-fulfillment.gs','utf8');
          const must=[
            'function starterFulfillmentPreview()',
            'function starterFulfillmentCreateVerifiedDrafts()',
            'LEGACY_STARTER_FULFILLMENT_DISABLED'
          ];
          for(const marker of must)if(!s.includes(marker))throw Error('Missing invariant: '+marker);
          if(/GmailApp\\.(?:sendEmail|createDraft)\\s*\\(/.test(s))
            throw Error('Legacy helper must not create or send mail');
          if(/https:\\/\\/docs\\.google\\.com\\/.*\\/d\\//.test(s))
            throw Error('Legacy helper must not expose paid material links');
          console.log('PASS: legacy fulfillment disabled; no paid-material URLs or Gmail sends');
          NODE
          node ops/test-starter-fulfillment.js
