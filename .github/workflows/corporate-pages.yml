name: Corporate Website - GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/corporate-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: corporate-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages content
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.parse
          base = os.environ["SITE_URL"].rstrip("/") + "/"
          checks = [
              ("", ['id="pricing"', 'id="partners"', "GuestOps AIの月額プランを見る"]),
              ("starter/", ["GuestOps AI Starter"]),
              ("field-guide/", ["3場面"]),
              ("starter/order/", ["20261029-direct-checkout-and-fulfillment", "その迷いを、施設のルールに変える"]),
              ("starter/upgrade/", ["diagnose()"]),
          ]
          for route, markers in checks:
              url = base + route + "?audit=" + os.environ["GITHUB_SHA"][:12]
              last = None
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "GuestOps-Pages-Smoke/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          html = response.read().decode("utf-8")
                          status = response.status
                      missing = [marker for marker in markers if marker not in html]
                      if status == 200 and not missing:
                          print("PASS", route or "/", status, "bytes", len(html.encode("utf-8")))
                          break
                      last = "missing markers: " + repr(missing)
                  except Exception as exc:
                      last = str(exc)
                  if attempt == 11:
                      raise SystemExit("FAIL " + route + ": " + str(last))
                  time.sleep(5)
          # A reachable checkout URL does not prove a successful payment or the configured amount.
          square_url = "https://square.link/u/nwGxRxvm"
          try:
              req = urllib.request.Request(square_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as response:
                  print("SQUARE_LINK_HTTP", response.status, "redirect", response.geturl().split("?")[0])
          except Exception as exc:
              print("SQUARE_LINK_UNVERIFIED", str(exc)[:200])
          PY
