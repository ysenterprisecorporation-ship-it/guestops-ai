name: Validate GuestOps AI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Starter Kit payment and buyer-access regression tests
        run: |
          node integrations/square-starter-fulfillment/test-fulfillment.cjs
          node integrations/square-starter-fulfillment/test-deployment.cjs
          node integrations/square-starter-fulfillment/test-legacy-privacy.cjs
          node integrations/square-starter-fulfillment/test-buyer-access.cjs
      - run: npm run build
      - run: git diff --exit-code -- dist
