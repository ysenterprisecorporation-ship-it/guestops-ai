name: Verify GuestOps production
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/starter/order/index.html'
      - 'docs/partners/index.html'
      - '.github/workflows/verify-starter-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=False
                  self.parts=[]
                  self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script":
                      self.active=not dict(attrs).get("src")
                      self.parts=[]
              def handle_data(self,data):
                  if self.active:
                      self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag=="script" and self.active:
                      self.scripts.append("".join(self.parts))
                      self.active=False
          p=Scripts()
          p.feed(Path("docs/index.html").read_text(encoding="utf-8"))
          assert p.scripts, "No inline scripts to validate"
          for i,script in enumerate(p.scripts):
              Path(f"/tmp/guestops-script-{i}.js").write_text(script,encoding="utf-8")
          PY
          for script in /tmp/guestops-script-*.js; do node --check "$script"; done
      - name: Check live landing and checkout pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ysenterprisecorporation-ship-it.github.io/guestops-ai"
          for i in {1..20}; do
            code_main=$(curl -L --silent --show-error --max-time 20 --output /tmp/guestops-main.html --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/?audit=${GITHUB_SHA}" || true)
            code_partner=$(curl -L --silent --show-error --max-time 20 --output /tmp/guestops-partner.html --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/partners/?audit=${GITHUB_SHA}" || true)
            code_order=$(curl -L --silent --show-error --max-time 20 --output /tmp/guestops-order.html --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/starter/order/?audit=${GITHUB_SHA}" || true)
            if [ "$code_main" = "200" ] && [ "$code_order" = "200" ] && [ "$code_partner" = "200" ] \
              && grep -Fq '「誰に確認する？」を減らす施設運営へ。' /tmp/guestops-main.html \
              && grep -Fq '9,800円/月' /tmp/guestops-main.html
              && grep -Fq 'Starter購入後、教材はどのように受け取りますか？' /tmp/guestops-main.html \ \
              && grep -Fq 'id="apply-guestops"' /tmp/guestops-main.html \
              && grep -Fq 'id="guestops-inquiry-form"' /tmp/guestops-main.html \
              && grep -Fq 'id="go-price-preview"' /tmp/guestops-main.html \
              && grep -Fq '月額料金の目安：' /tmp/guestops-main.html \
              && grep -Fq '顧客への案内文（編集して使用可能）' /tmp/guestops-partner.html \
              && grep -Fq 'href="partners/"' /tmp/guestops-main.html \
              && grep -Fq '購入後、最初に使う3つの場面' /tmp/guestops-order.html
              && grep -Fq '決済から利用開始まで' /tmp/guestops-order.html
              && grep -Fq '購入前のチェックリスト' /tmp/guestops-order.html \ \ \
              && grep -Fq '../../#apply-guestops' /tmp/guestops-order.html \
              && grep -Fq 'その迷いを、施設のルールに変える' /tmp/guestops-order.html; then
              echo "PASS: live pages contain latest conversion copy and pricing"
              exit 0
            fi
            echo "Attempt $i: main HTTP $code_main, order HTTP $code_order, partner HTTP $code_partner; latest content not yet verified"
            sleep 15
          done
          echo "::error::Live GitHub Pages content differs from expected main/order HTML"
          exit 1
