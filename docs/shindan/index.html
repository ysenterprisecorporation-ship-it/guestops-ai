<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3分でわかるAI判断負債診断｜AI検証所</title>
<meta name="description" content="生成AI導入後に残る確認待ち・承認集中・例外判断の曖昧さを8問で可視化。AI処理、人確認、責任者承認、停止条件の整理余地を診断します。">
<meta name="robots" content="index,follow">
<style>
:root{--ink:#102039;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--line:#dce3ee;--accent:#2256d8;--low:#0b6b46;--mid:#a35f00;--high:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:860px;margin:auto;padding:28px 18px 64px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin:16px 0}
.hero{background:linear-gradient(135deg,#102452,#2256d8);color:#fff}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.3;margin:.2em 0}.hero p{max-width:720px}
.q{margin:22px 0 28px}.q h2{font-size:18px;margin-bottom:12px}.choices{display:grid;gap:9px}.choices label{display:block;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:white;cursor:pointer}.choices input{margin-right:9px}
button,.cta{display:inline-block;border:0;border-radius:11px;padding:14px 20px;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;cursor:pointer;font-size:16px}
.cta.secondary{background:#fff;color:#173c99;border:1px solid #b8c7ee}
#result{display:none}.score{font-size:54px;font-weight:900;line-height:1}.risk{font-size:24px;font-weight:900;margin:10px 0}.low{color:var(--low)}.mid{color:var(--mid)}.high{color:var(--high)}.bar{height:14px;background:#e6eaf1;border-radius:999px;overflow:hidden;margin:14px 0}.bar span{display:block;height:100%;background:var(--accent);width:0}.small{font-size:13px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}ul{padding-left:1.25em}
</style>
</head>
<body>
<main>
<section class="hero">
  <strong>AI検証所｜無料診断</strong>
  <h1>3分でわかる<br>AI判断負債診断</h1>
  <p>生成AIを導入したのに「結局、人が全部確認する」「責任者への確認が増える」「例外時に止まる」が残っていないかを8問で可視化します。</p>
</section>

<form id="quiz" class="card">
  <div id="questions"></div>
  <button type="submit">診断結果を見る</button>
  <p class="small">入力内容はこのページ内だけで計算され、サーバーへ送信しません。</p>
</form>

<section id="result" class="card">
  <div class="score"><span id="score">0</span><span style="font-size:22px"> / 100</span></div>
  <div id="risk" class="risk"></div>
  <div class="bar"><span id="bar"></span></div>
  <p id="summary"></p>
  <ul id="advice"></ul>
  <div class="actions">
    <a class="cta" id="mailcta" href="mailto:ai.kenshosho@gmail.com?subject=AI判断負債診断の相談">診断結果をもとに相談する</a>
    <a class="cta secondary" href="../ai-kenshosho/">サービス詳細を見る</a>
    <button type="button" id="retry" style="background:#5e6675">もう一度診断する</button>
  </div>
  <p class="small">診断結果は自己評価による簡易チェックです。業務成果や法的適合性を保証するものではありません。</p>
</section>
</main>
<script>
const items=[
"AIに任せてよい業務範囲が、担当者ごとではなく明文化されていますか？",
"AI出力を人が確認すべき条件と、確認不要の条件が分かれていますか？",
"責任者承認が必要な価格・契約・対外発信などの条件が決まっていますか？",
"根拠不足・個人情報・法務・想定外例外でAIを停止する条件がありますか？",
"AI導入後に『念のため人が全部確認する』運用が常態化していませんか？",
"例外が起きた時、誰が判断し、どこまで決められるか明確ですか？",
"PoCから本番運用へ移す際の合格基準・差戻し条件が決まっていますか？",
"過去の判断理由を次回のAI利用・承認ルールへ反映できていますか？"
];
const options=[["明確にできている",0],["概ねできている",1],["一部曖昧",2],["ほぼ未整理",3]];
const wrap=document.getElementById("questions");
items.forEach((q,i)=>{
 const box=document.createElement("div");box.className="q";
 box.innerHTML='<h2>Q'+(i+1)+'. '+q+'</h2><div class="choices">'+options.map(o=>'<label><input required type="radio" name="q'+i+'" value="'+o[1]+'">'+o[0]+'</label>').join("")+'</div>';
 wrap.appendChild(box);
});
document.getElementById("quiz").addEventListener("submit",e=>{
 e.preventDefault();const fd=new FormData(e.target);let raw=0;
 for(let i=0;i<items.length;i++)raw+=Number(fd.get("q"+i));
 const total=Math.round(raw/24*100);
 document.getElementById("score").textContent=total;document.getElementById("bar").style.width=total+"%";
 const risk=document.getElementById("risk"),summary=document.getElementById("summary"),advice=document.getElementById("advice");
 let label,cls,text,points;
 if(total<=29){label="判断負債：低";cls="low";text="AIと人の境界は比較的整理されています。次は判断履歴を運用へ戻し、担当変更や業務拡張でも同じ基準を使える状態にすると効果的です。";points=["判断理由の記録方法を固定する","例外時の停止条件を定期更新する","PoC評価基準と本番運用基準を接続する"];}
 else if(total<=59){label="判断負債：中";cls="mid";text="一部業務でAI・担当者・責任者の境界が曖昧な可能性があります。頻出業務を1つ選び、判断条件を固定すると改善しやすい状態です。";points=["AI処理／人確認／責任者承認／停止条件の4区分化","頻出例外と承認条件を1業務から整理","判断マトリクスとチェックリストを作る"];}
 else{label="判断負債：高";cls="high";text="AI導入後も確認待ち・承認集中・例外停止が残っている可能性が高い状態です。AI機能追加より先に、業務側の判断境界を要件として整理する余地があります。";points=["最も確認回数の多い1業務を特定","AI・担当者・責任者の権限境界を明文化","停止条件・差戻し条件・PoC合格基準を要件化"];}
 risk.textContent=label;risk.className="risk "+cls;summary.textContent=text;advice.innerHTML=points.map(p=>"<li>"+p+"</li>").join("");
 document.getElementById("mailcta").href="mailto:ai.kenshosho@gmail.com?subject="+encodeURIComponent("AI判断負債診断の相談（"+total+"点）")+"&body="+encodeURIComponent("診断結果："+total+"点\n対象にしたい業務：\n");
 document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("retry").addEventListener("click",()=>{document.getElementById("quiz").reset();document.getElementById("quiz").style.display="block";document.getElementById("result").style.display="none";window.scrollTo({top:0,behavior:"smooth"});});
</script>
</body>
</html>
