<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuestOps AI 初期構築フォーム</title>
<meta name="description" content="GuestOps AIの初期判断ルール構築に必要な情報を整理する入力フォームです。">
<style>
:root{--ink:#172033;--muted:#657086;--bg:#f5f7fb;--card:#fff;--line:#dbe3ee;--accent:#244fd7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:760px;margin:auto;padding:28px 18px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0}
h1{font-size:clamp(28px,5vw,42px);line-height:1.3}.lead{color:var(--muted)}
label{display:block;font-weight:800;margin:18px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white}textarea{min-height:110px}
button{border:0;border-radius:11px;padding:14px 18px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.small{font-size:13px;color:var(--muted)}.preview{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:18px;display:none}
</style>
</head>
<body>
<main>
<section class="card">
<h1>GuestOps AI<br>初期構築フォーム</h1>
<p class="lead">導入開始時の「現場判断／責任者確認／オーナー承認／停止条件」を整理するための初期情報です。入力内容はこのページ内でメール本文に変換されます。</p>

<form id="f">
<label for="company">会社・運営名</label>
<input id="company" required>

<label for="count">対象施設数</label>
<select id="count" required>
<option value="">選択してください</option>
<option>1施設</option><option>2施設</option><option>3施設</option><option>4施設以上</option>
</select>

<label for="properties">対象施設名・呼称</label>
<textarea id="properties" placeholder="例：葛西A、葛西B"></textarea>

<label for="cases">優先して標準化したい場面</label>
<textarea id="cases" required placeholder="例：清掃不備、設備故障、返金・補償、夜間対応"></textarea>

<label for="approval">現在の承認ルール</label>
<textarea id="approval" placeholder="例：返金は責任者確認、設備故障は現場判断など"></textarea>

<label for="notes">その他の運用条件</label>
<textarea id="notes" placeholder="営業時間、オーナー確認条件、施設固有ルール等"></textarea>

<button type="submit">入力内容をメールで送る</button>
<p class="small">送信ボタンを押すと、入力内容を入れたメール作成画面が開きます。送信先：minpaku.ai.kit@gmail.com</p>
</form>
<div id="preview" class="preview"></div>
</section>
</main>
<script>
const v=id=>document.getElementById(id).value.trim();
document.getElementById("f").addEventListener("submit",e=>{
 e.preventDefault();
 const subject="GuestOps AI 初期構築情報";
 const body=[
  "会社・運営名："+v("company"),
  "対象施設数："+v("count"),
  "",
  "【対象施設名・呼称】",
  v("properties")||"未記入",
  "",
  "【優先して標準化したい場面】",
  v("cases"),
  "",
  "【現在の承認ルール】",
  v("approval")||"未記入",
  "",
  "【その他の運用条件】",
  v("notes")||"未記入"
 ].join("\n");
 const mailto="mailto:minpaku.ai.kit@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
 document.getElementById("preview").style.display="block";
 document.getElementById("preview").textContent=body;
 window.location.href=mailto;
});
</script>
</body>
</html>
